[workspace]
resolver = "2"
members = ["app", "frontend", "server"]

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_axum = "0.8"

axum = "0.8"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wasm-bindgen = "=0.2.126"

leptos-leaflet = { version = "0.10.2", default-features = false }
leptos-leaflet-hotline = { path = "../..", default-features = false }

[profile.wasm-release]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

[[workspace.metadata.leptos]]
name = "leptos-leaflet-hotline-example"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false
lib-profile-release = "wasm-release"
