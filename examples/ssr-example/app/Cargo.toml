[package]
name = "app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos-leaflet.workspace = true
leptos-leaflet-hotline.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen.workspace = true

[features]
default = []
hydrate = [
  "leptos/hydrate",
  "leptos-leaflet/hydrate",
  "leptos-leaflet-hotline/hydrate",
]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "leptos-leaflet/ssr",
  "leptos-leaflet-hotline/ssr",
]
